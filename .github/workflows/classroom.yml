# ─────────────────────────────────────────────────────────────────────
# CS++ Autograding Workflow — generated by the CS++ test builder.
# https://csplusplus.com/github · https://csplusplus.com/help/github-autograder
#
# CS++ installs this file at .github/workflows/classroom.yml in each
# student repo. Every push runs the tests below on GitHub Actions; the
# reporter publishes the score CS++ reads back into the gradebook, and
# the summary step renders a results table on the run's Summary tab.
# ─────────────────────────────────────────────────────────────────────
name: CS++ Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    steps:
      - name: Check out student code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Movie constructor and validation'
        id: movie-constructor-and-validation
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Movie constructor and validation'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieTest#constructor_*" test'
          timeout: 5
          max-score: 25

      - name: 'Movie setters'
        id: movie-setters
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Movie setters'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieTest#setters_*" test'
          timeout: 5
          max-score: 10

      - name: 'Movie toString'
        id: movie-tostring
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Movie toString'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieTest#toString_*" test'
          timeout: 5
          max-score: 5

      - name: 'MovieLibrary add and size'
        id: movielibrary-add-and-size
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'MovieLibrary add and size'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieLibraryTest#newLibrary_*+add_*" test'
          timeout: 5
          max-score: 15

      - name: 'MovieLibrary find and remove'
        id: movielibrary-find-and-remove
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'MovieLibrary find and remove'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieLibraryTest#findByTitle_*+removeByTitle_*" test'
          timeout: 5
          max-score: 10

      - name: 'MovieLibrary averageRating'
        id: movielibrary-averagerating
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'MovieLibrary averageRating'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieLibraryTest#averageRating_*" test'
          timeout: 5
          max-score: 10

      - name: 'MovieLibrary longestRuntime'
        id: movielibrary-longestruntime
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'MovieLibrary longestRuntime'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieLibraryTest#longestRuntime_*" test'
          timeout: 5
          max-score: 10

      - name: 'MovieLibrary ratedAtLeast'
        id: movielibrary-ratedatleast
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'MovieLibrary ratedAtLeast'
          setup-command: 'mvn -B -q compile'
          command: 'mvn -B -Dtest="MovieLibraryTest#ratedAtLeast_*" test'
          timeout: 5
          max-score: 15

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          MOVIE-CONSTRUCTOR-AND-VALIDATION_RESULTS: "${{steps.movie-constructor-and-validation.outputs.result}}"
          MOVIE-SETTERS_RESULTS: "${{steps.movie-setters.outputs.result}}"
          MOVIE-TOSTRING_RESULTS: "${{steps.movie-tostring.outputs.result}}"
          MOVIELIBRARY-ADD-AND-SIZE_RESULTS: "${{steps.movielibrary-add-and-size.outputs.result}}"
          MOVIELIBRARY-FIND-AND-REMOVE_RESULTS: "${{steps.movielibrary-find-and-remove.outputs.result}}"
          MOVIELIBRARY-AVERAGERATING_RESULTS: "${{steps.movielibrary-averagerating.outputs.result}}"
          MOVIELIBRARY-LONGESTRUNTIME_RESULTS: "${{steps.movielibrary-longestruntime.outputs.result}}"
          MOVIELIBRARY-RATEDATLEAST_RESULTS: "${{steps.movielibrary-ratedatleast.outputs.result}}"
        with:
          runners: movie-constructor-and-validation,movie-setters,movie-tostring,movielibrary-add-and-size,movielibrary-find-and-remove,movielibrary-averagerating,movielibrary-longestruntime,movielibrary-ratedatleast

      - name: CS++ Results Summary
        if: always()
        env:
          MOVIE-CONSTRUCTOR-AND-VALIDATION_RESULTS: "${{steps.movie-constructor-and-validation.outputs.result}}"
          MOVIE-SETTERS_RESULTS: "${{steps.movie-setters.outputs.result}}"
          MOVIE-TOSTRING_RESULTS: "${{steps.movie-tostring.outputs.result}}"
          MOVIELIBRARY-ADD-AND-SIZE_RESULTS: "${{steps.movielibrary-add-and-size.outputs.result}}"
          MOVIELIBRARY-FIND-AND-REMOVE_RESULTS: "${{steps.movielibrary-find-and-remove.outputs.result}}"
          MOVIELIBRARY-AVERAGERATING_RESULTS: "${{steps.movielibrary-averagerating.outputs.result}}"
          MOVIELIBRARY-LONGESTRUNTIME_RESULTS: "${{steps.movielibrary-longestruntime.outputs.result}}"
          MOVIELIBRARY-RATEDATLEAST_RESULTS: "${{steps.movielibrary-ratedatleast.outputs.result}}"
        run: |
          node <<'CSPP_SUMMARY'
          const fs = require('fs');
          const PASS = '\u2705', FAIL = '\u274c', WARN = '\u26a0\ufe0f';
          const fmt = (n) => (Math.round(n * 100) / 100).toString();
          const esc = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
          const keys = Object.keys(process.env).filter((k) => k.endsWith('_RESULTS')).sort();
          const rows = [];
          let earned = 0, possible = 0, passedCount = 0, testCount = 0;
          for (const key of keys) {
            const runner = key.slice(0, -8).toLowerCase();
            let data = null;
            try { data = JSON.parse(Buffer.from(process.env[key] || '', 'base64').toString('utf8')); } catch (e) {}
            if (!data || !Array.isArray(data.tests) || data.tests.length === 0) {
              rows.push('| ' + WARN + ' | `' + esc(runner) + '` | no result |');
              continue;
            }
            const max = Number(data.max_score) || 0;
            let rEarned = 0, rPassed = 0;
            for (const t of data.tests) {
              if (t.status === 'pass') rPassed += 1;
              rEarned += Number(t.score) || 0;
            }
            if (max > 0 && rEarned === 0 && rPassed > 0) {
              rEarned = (rPassed / data.tests.length) * max;
            }
            if (rEarned > max && max > 0) rEarned = max;
            earned += max > 0 ? rEarned : 0;
            possible += max;
            passedCount += rPassed;
            testCount += data.tests.length;
            if (data.tests.length === 1) {
              const t = data.tests[0];
              const icon = t.status === 'pass' ? PASS : FAIL;
              rows.push('| ' + icon + ' | ' + esc(t.name || runner) + ' | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            } else {
              for (const t of data.tests) {
                rows.push('| ' + (t.status === 'pass' ? PASS : FAIL) + ' | ' + esc(t.name || runner) + ' | |');
              }
              rows.push('| ' + (rPassed === data.tests.length ? PASS : FAIL) + ' | **' + esc(runner) + ' subtotal** | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            }
          }
          const md = [
            '## \ud83c\udf93 CS++ Autograder Results',
            '',
            '| | Test | Points |',
            '|---|---|---:|',
            ...rows,
            '',
            '**Total: ' + fmt(earned) + ' / ' + fmt(possible) + ' points** \u00b7 ' + passedCount + ' of ' + testCount + ' tests passed',
            '',
          ].concat(possible > 0 ? [] : [
            WARN + ' No points are configured, so no score reports to the CS++ gradebook.',
            '',
          ]).concat([
            'Scores sync automatically to the CS++ gradebook \u2014 per-test detail appears on your CS++ dashboard.',
            '',
            '_Autograded by [CS++ Classroom for GitHub](https://csplusplus.com/github)_',
            '',
          ]).join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          CSPP_SUMMARY
